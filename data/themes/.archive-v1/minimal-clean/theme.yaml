# Minimal Clean Theme
# 極簡清爽主題 - 適合學術和專業演示

name: "Minimal Clean"
description: "淺色極簡風格，適合學術演示"
author: "AISliDev"
version: "1.0.0"

colorSchema: light

colors:
  primary: "#2c3e50"
  accent: "#34495e"
  accentLight: "#95a5a6"
  background: "#f8f9fa"
  backgroundAlt: "#ffffff"
  text: "#2c3e50"
  textSecondary: "#555555"
  textMuted: "#95a5a6"
  codeBackground: "#f5f5f5"
  codeForeground: "#2c3e50"
  border: "#e0e0e0"

fonts:
  sans: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  mono: "'Fira Code', 'Cascadia Code', Consolas, Monaco, 'Courier New', monospace"

fontSizes:
  h1: 4.0
  h2: 2.5
  h3: 1.75
  body: 1.5
  code: 1.1

spacing:
  slidesPadding: 4.0
  elementGap: 1.5

customCSS: "custom.css"
